<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Language Translation Tool</h1>

        <textarea id="textInput" placeholder="Enter text to translate..."></textarea>

        <div class="languages">

            <div>
                <label>From:</label>
                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                </select>
            </div>

            <div>
                <label>To:</label>
                <select id="targetLanguage">
                    <option value="fr">French</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                </select>
            </div>

        </div>

        <button id="translateButton">Translate</button>

        <h2>Translation</h2>

        <div id="translationResult">
            Your translation will appear here.
        </div>

        <button id="copyButton">Copy Translation</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
